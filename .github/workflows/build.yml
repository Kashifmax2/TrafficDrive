name: Build installers

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]

jobs:
  windows:
    name: Windows EXE
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download Playwright Chromium
        run: npx playwright install chromium

      - name: Prepare bundled Chromium
        run: npm run chromium:prepare

      - name: Privacy features + device matrix test
        run: npm run test:privacy

      - name: Build NSIS + portable EXE
        run: npm run build:win

      - uses: actions/upload-artifact@v4
        with:
          name: TrafficDrive-windows
          path: |
            dist/*.exe
          if-no-files-found: error

  linux:
    name: Linux AppImage + deb
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download Chromium + system libraries
        run: npx playwright install --with-deps chromium

      - name: Prepare bundled Chromium
        run: npm run chromium:prepare

      - name: Runtime smoke test (backend + browser + detection)
        run: xvfb-run -a npm run smoke

      - name: Privacy features + device matrix test
        run: xvfb-run -a npm run test:privacy

      - name: Build AppImage + deb
        run: npm run build:linux

      - uses: actions/upload-artifact@v4
        with:
          name: TrafficDrive-linux
          path: |
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/TrafficDrive-windows/*.exe
            artifacts/TrafficDrive-linux/*.AppImage
            artifacts/TrafficDrive-linux/*.deb
          generate_release_notes: true
